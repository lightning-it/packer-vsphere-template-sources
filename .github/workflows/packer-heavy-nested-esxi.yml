# yamllint disable rule:line-length
# yamllint disable rule:truthy
---
name: Packer Heavy Nested ESXi

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      build_kind:
        description: "Build kind: rhel or ubuntu"
        required: true
        default: rhel
        type: choice
        options: [rhel, ubuntu]
      build_version:
        description: "RHEL major or Ubuntu release"
        required: true
        default: "8"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  heavy:
    name: Delegate Heavy execution
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.head_ref == 'develop' &&
        github.base_ref == 'main' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    uses: lightning-it/modulix-validation/.github/workflows/packer-nested-esxi-profile.yml@d872848305320ee2b75f8d3b70d899ec31655c71
    with:
      validation-sha: d872848305320ee2b75f8d3b70d899ec31655c71
      source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      build-kind: ${{ inputs.build_kind || 'rhel' }}
      build-version: ${{ inputs.build_version || '8' }}
      environment-name: packer-heavy
    secrets:
      PACKER_NESTED_ESXI_USERNAME: ${{ secrets.PACKER_NESTED_ESXI_USERNAME }}
      PACKER_NESTED_ESXI_PASSWORD: ${{ secrets.PACKER_NESTED_ESXI_PASSWORD }}
      PACKER_INSTALLER_PASSWORD: ${{ secrets.PACKER_INSTALLER_PASSWORD }}
      PACKER_INSTALLER_PASSWORD_HASH: ${{ secrets.PACKER_INSTALLER_PASSWORD_HASH }}
      LIT_REPOSITORY_READ_TOKEN: ${{ secrets.LIT_REPOSITORY_READ_TOKEN }}
